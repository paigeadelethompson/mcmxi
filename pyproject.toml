[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcmxi-sopel-bot"
version = "0.1.0"
description = "Sopel IRC bot with module loading verification"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "sopel>=8.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "gql>=3.4.0",
    "requests>=2.31.0",
    "pexpect>=4.8.0",
    "telnetlib3>=2.0.0",
    "paho-mqtt>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "autopep8>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcmxi_bot"]

[tool.hatch.envs.default.scripts]
start = "sopel -c config.cfg"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E266", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    "venv",
]

[tool.autopep8]
max_line_length = 100
aggressive = 1

